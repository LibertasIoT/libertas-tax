[package]
name = "libertas-tax"
version = "0.1.0"
edition = "2024"
description = "Prepares a 2026 U.S. federal income tax return estimate. Import your tax documents with AI, answer only the questions your documents and situation raise, and see your estimated tax, payments and balance due or refund. One saved return per user; resume where you left off. Alpha version."
repository = "https://github.com/LibertasIoT/libertas-tax.git"

[dependencies]
libertas = { git = "https://github.com/LibertasIoT/libertas-rs.git", rev = "0f8cbf0bc89deab15d0ac051a1c15d58bacad89c", package = "libertas" }
libertas_macros = { git = "https://github.com/LibertasIoT/libertas-rs.git", rev = "0f8cbf0bc89deab15d0ac051a1c15d58bacad89c", package = "libertas_macros" }
lru = { version = "0.18.5", default-features = false, features = ["hashbrown"] }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint"] }

[dev-dependencies]
tax-test-heap = { path = "tools/test-heap" }
tax-paired-figures = { path = "tools/paired-figures" }
zstd = "0.13.3"
sha2 = "0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "libertas_tax"
crate-type = ["rlib"]

# Tests and debug builds run optimized: the heaviest return tests are 40x faster at opt-level 1
# (148 s -> 3.7 s) at about the same incremental compile cost. Overflow checks stay on.
[profile.dev]
opt-level = 1
